# Publish to PyPI when a release is cut (or manually dispatched).
#
# One-time setup for the repo owner:
#   1. Create a PyPI account at https://pypi.org (jeffm7007@gmail.com)
#   2. Account settings → API tokens → create a token scoped to "ignorance2"
#   3. GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: PYPI_API_TOKEN   Value: pypi-...
#
# After that: every GitHub Release (or workflow_dispatch) builds, checks, and uploads.

name: Publish ignorance2 to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ignorance2/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Run the test suite (13 tests — the gate proves itself before it ships)
        run: |
          python -m unittest discover -s tests -v

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
